name: 🚥 CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 💅 Lint
    runs-on: ubuntu-latest
    steps:
      - name: pnpm install
        uses: falcondev-it/.github/actions/pnpm-install@master

      - name: Cache ESLint & Prettier
        uses: actions/cache@v5
        with:
          path: |
            .eslintcache
            node_modules/.cache/prettier/.prettier-cache
          key: eslint-prettier-cache-${{ runner.os }}

      - run: pnpm run lint:ci

  type-check:
    name: 🛃 Type Check
    runs-on: ubuntu-latest
    steps:
      - name: pnpm install
        uses: falcondev-it/.github/actions/pnpm-install@master

      - run: pnpm run type-check

  test-unit:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        storage-driver: [filesystem, s3, gcs]
        db-driver: [postgres, mysql, sqlite]
    steps:
      - name: pnpm install
        uses: falcondev-it/.github/actions/pnpm-install@master

      - run: pnpm run test:run
        env:
          VITEST_DB_DRIVER: ${{ matrix.db-driver }}
          VITEST_STORAGE_DRIVER: ${{ matrix.storage-driver }}

  deploy:
    name: 🚀 Build and push
    permissions:
      packages: write
      contents: read
    needs: [lint, type-check, test-unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Get build hash
        id: build_hash
        run: echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            ${{ github.ref_name }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_HASH=${{ steps.build_hash.outputs.COMMIT_SHA }}

      - name: Extract metadata (tags, labels) for Docker (caged)
        id: meta-caged
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            ${{ github.ref_name }}-caged

      - name: Build and push (caged)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-caged.outputs.tags }}
          labels: ${{ steps.meta-caged.outputs.labels }}
          build-args: |
            BUILD_HASH=${{ steps.build_hash.outputs.COMMIT_SHA }}
            BASE_IMAGE=platformatic/node-caged:25-alpine

  deploy-chart:
    name: 🚀 Build and push Helm chart
    permissions:
      packages: write
      contents: read
    needs: [deploy]
    runs-on: ubuntu-latest
    env:
      CHART_DIR: install/kubernetes/github-actions-cache-server
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Bump version
        id: bump-version
        run: |
          export VERSION=$(node -p "require('./package.json').version")
          node scripts/release-metadata.mjs bump dev

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Helm chart
        run: helm package . --destination packaged
        working-directory: ${{ env.CHART_DIR }}

      - name: Push Helm chart to GHCR
        run: |
          shopt -s nullglob
          for pkg in ${{ env.CHART_DIR }}/packaged/*.tgz; do
            echo "Pushing $pkg to ghcr.io/${{ github.repository_owner }}/charts"
            helm push "$pkg" "oci://ghcr.io/${{ github.repository_owner }}/charts"
          done
